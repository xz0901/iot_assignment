apiVersion: v1
kind: ConfigMap
metadata:
  name: studymate-config
  labels:
    app: studymate
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="ko">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate — 나의 공부 공간</title>
    <style>
    :root {
      --bg:#f7f7f5; --panel:#fff; --sidebar:#fbfbfa; --text:#37352f;
      --muted:#9b9a97; --line:#e9e9e7; --accent:#2383e2; --green:#448361;
      --soft-green:#eaf3ed; --soft-blue:#eaf2fb; --soft-yellow:#fbf3db;
      --shadow:0 1px 2px rgba(15,15,15,.04);
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;font-size:14px}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:235px minmax(0,1fr)}
    .sidebar{background:var(--sidebar);border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column;gap:28px}
    .brand{display:flex;align-items:center;gap:10px;padding:0 9px;font-weight:700;font-size:16px}
    .brand-mark{width:29px;height:29px;border-radius:8px;background:#37352f;color:white;display:grid;place-items:center;font-size:15px}
    .side-label{font-size:11px;letter-spacing:.06em;color:var(--muted);padding:0 10px;margin-bottom:8px}
    .nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:#5c5b56;text-decoration:none;margin:2px 0}
    .nav.active,.nav:hover{background:#efefed;color:var(--text)}
    .nav-icon{width:18px;text-align:center;color:#777}
    .sidebar-note{margin-top:auto;background:#f1f1ef;border-radius:8px;padding:13px;color:#686761;font-size:12px;line-height:1.6}
    .main{max-width:1180px;width:100%;margin:0 auto;padding:38px 52px 60px}
    .breadcrumb{font-size:12px;color:var(--muted);margin-bottom:25px}
    .header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:27px}
    h1{font-size:30px;letter-spacing:-.04em;margin:0 0 8px;font-weight:700}
    .subtitle{color:#85847f;font-size:13px}
    .date-pill{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 11px;color:#777;font-size:12px;white-space:nowrap}
    .quote{background:#fff;border:1px solid var(--line);border-radius:9px;padding:17px 19px;margin-bottom:22px;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px}
    .quote-icon{font-size:20px;color:#888}.quote-editor{display:flex;gap:8px;align-items:center;flex:1}.quote-input{width:100%;min-width:0;border:0;outline:none;background:transparent;color:var(--text);font-size:13px}.quote-input::placeholder{color:#aaa}.quote-save{border:1px solid var(--line);background:#fff;border-radius:5px;padding:6px 10px;color:#777;font-size:11px;white-space:nowrap}.quote-save:hover{background:#f5f5f3}
    .quote strong{display:block;font-size:13px;margin-bottom:4px}
    .quote span{font-size:12px;color:#888}
    .grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.9fr);gap:18px;align-items:start}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:19px 20px;box-shadow:var(--shadow);margin-bottom:18px}
    .card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}
    .card-title{font-size:14px;font-weight:650}
    .card-sub{font-size:11px;color:var(--muted);margin-top:4px}
    .link-btn{border:0;background:none;color:var(--muted);font-size:12px;padding:4px}
    .link-btn:hover{color:var(--text)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
    .stat{border:1px solid var(--line);border-radius:8px;padding:13px;background:#fff}
    .stat-label{font-size:11px;color:var(--muted);margin-bottom:9px}
    .stat-value{font-size:22px;font-weight:650;letter-spacing:-.04em}
    .stat-foot{font-size:11px;color:#999;margin-top:4px}
    .progress-track{height:7px;background:#efefed;border-radius:10px;overflow:hidden}
    .progress-fill{height:100%;width:0;background:var(--green);border-radius:10px;transition:width .25s}
    .progress-meta{display:flex;justify-content:space-between;color:#8c8b86;font-size:11px;margin:9px 0 12px}
    .task-form{display:flex;gap:8px;margin-bottom:14px}
    .task-input{min-width:0;flex:1;border:1px solid var(--line);border-radius:6px;padding:10px 11px;outline:none;background:#fff}
    .task-input:focus{border-color:#b8cde0;box-shadow:0 0 0 2px #eaf2fb}
    .primary{border:0;border-radius:6px;background:#37352f;color:#fff;padding:0 15px;font-size:12px}
    .primary:hover{background:#55534d}
    .task-tools{display:flex;gap:5px;margin-bottom:9px}
    .filter{border:0;background:transparent;color:#999;padding:5px 8px;border-radius:5px;font-size:11px}
    .filter.active{background:#efefed;color:#444}
    .task-list{list-style:none;margin:0;padding:0}
    .task{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid #f1f1ef}
    .task:last-child{border-bottom:0}
    .task-check{appearance:none;width:16px;height:16px;border:1.5px solid #c9c9c5;border-radius:4px;flex:none;cursor:pointer;position:relative}
    .task-check:checked{background:var(--green);border-color:var(--green)}
    .task-check:checked:after{content:"✓";position:absolute;color:white;font-size:11px;left:2px;top:-1px}
    .task-name{flex:1;min-width:0;overflow-wrap:anywhere}
    .task.done .task-name{text-decoration:line-through;color:#aaa}
    .tag{font-size:10px;color:#777;background:#f1f1ef;padding:4px 7px;border-radius:4px;white-space:nowrap}
    .delete{border:0;background:none;color:#bbb;font-size:16px;padding:2px 5px}
    .delete:hover{color:#c45b53}
    .empty{padding:24px 5px;text-align:center;color:#aaa;font-size:12px}
    .timer{text-align:center;padding:9px 0 4px}
    .timer-mode{font-size:11px;color:#999;margin-bottom:10px}
    .timer-display{font-size:52px;font-weight:650;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:3px 0 14px}
    .timer-actions{display:flex;justify-content:center;gap:7px}
    .timer-btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 13px;font-size:11px;color:#555}
    .timer-btn.main{background:#37352f;color:#fff;border-color:#37352f;min-width:82px}
    .timer-modes{display:flex;justify-content:center;gap:6px;margin-top:15px}
    .mode-btn{border:0;background:transparent;color:#999;font-size:11px;padding:5px 8px;border-radius:5px}
    .mode-btn.active{background:#f0f0ee;color:#555}
    .tip{background:#f7f7f5;border-radius:7px;padding:12px;margin-top:17px;color:#777;font-size:11px;line-height:1.6;text-align:left}
    .week-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}
    .day{font-size:10px;text-align:center;color:#aaa}
    .day-dot{width:25px;height:25px;border-radius:50%;margin:6px auto 0;display:grid;place-items:center;background:#f2f2f0;color:#888;font-size:10px}
    .day.today .day-dot{background:#37352f;color:white}
    .footer{text-align:center;color:#b0afaa;font-size:10px;padding:16px}
    @media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:28px 20px 45px}.grid{grid-template-columns:1fr}}
    @media(max-width:480px){.main{padding:22px 14px}.header{display:block}.date-pill{display:inline-block;margin-top:13px}.stats{gap:6px}.stat{padding:10px}.stat-value{font-size:19px}.card{padding:16px}}
    </style>
    </head>
    <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand"><div class="brand-mark">S</div> StudyMate</div>
        <div>
          <div class="side-label">WORKSPACE</div>
          <a class="nav active" href="#"><span class="nav-icon">⌂</span> 대시보드</a>
          <a class="nav" href="#tasks"><span class="nav-icon">☷</span> 오늘의 할 일</a>
          <a class="nav" href="#timer"><span class="nav-icon">◷</span> 집중 타이머</a>
        </div>
        <div>
          <div class="side-label">MY SPACE</div>
          <a class="nav" href="#progress"><span class="nav-icon">▥</span> 학습 현황</a>
        </div>
      </aside>
    
      <main class="main">
        <header class="header">
          <div><h1>나의 공부 공간 ✦</h1></div>
          <div class="date-pill" id="todayDate">날짜를 불러오는 중</div>
        </header>
    
        <section class="quote">
          <div class="quote-icon">✎</div>
          <div class="quote-editor">
            <input id="quoteInput" class="quote-input" maxlength="160" placeholder="오늘 기억하고 싶은 문장이나 명언을 입력하세요.">
            <button class="quote-save" id="saveQuote" type="button">저장</button>
          </div>
        </section>
    
        <div class="stats" id="progress">
          <div class="stat"><div class="stat-label">오늘의 할 일</div><div class="stat-value" id="totalCount">0</div><div class="stat-foot">등록한 목표</div></div>
          <div class="stat"><div class="stat-label">완료한 일</div><div class="stat-value" id="doneCount">0</div><div class="stat-foot">해낸 작은 성취</div></div>
          <div class="stat"><div class="stat-label">달성률</div><div class="stat-value" id="percent">0%</div><div class="stat-foot">오늘의 진행 상황</div></div>
        </div>
    
        <div class="grid">
          <div>
            <section class="card" id="tasks">
              <div class="card-head"><div><div class="card-title">오늘의 공부 목표</div></div><button class="link-btn" id="clearDone">완료 항목 지우기</button></div>
              <form class="task-form" id="taskForm">
                <input class="task-input" id="taskInput" maxlength="90" placeholder="예: 토익 Part 7 지문 3개 풀기" autocomplete="off" required>
                <button class="primary" type="submit">+ 추가</button>
              </form>
              <div class="task-tools">
                <button class="filter active" data-filter="all">전체</button>
                <button class="filter" data-filter="active">진행 중</button>
                <button class="filter" data-filter="done">완료</button>
              </div>
              <ul class="task-list" id="taskList"></ul>
              <div class="empty" id="emptyState">아직 등록된 목표가 없어요. 첫 번째 공부 목표를 추가해 보세요!</div>
            </section>
    
            <section class="card">
              <div class="card-head"><div><div class="card-title">이번 주의 리듬</div></div></div>
              <div class="week-days" id="weekDays"></div>
            </section>
          </div>
    
          <div>
            <section class="card" id="timer">
              <div class="card-head"><div><div class="card-title">집중 타이머</div></div><span class="tag">POMODORO</span></div>
              <div class="timer">
                <div class="timer-mode" id="timerMode">집중 시간</div>
                <div class="timer-display" id="timerDisplay">25:00</div>
                <div class="timer-actions">
                  <button class="timer-btn main" id="startPause">시작</button>
                  <button class="timer-btn" id="resetTimer">초기화</button>
                </div>
                <div class="timer-modes">
                  <button class="mode-btn active" data-minutes="25" data-mode="focus">집중 25분</button>
                  <button class="mode-btn" data-minutes="5" data-mode="break">휴식 5분</button>
                </div>
              </div>
            </section>
    
          </div>
        </div>
        <div class="footer">Made for your steady progress · StudyMate</div>
      </main>
    </div>
    <script>
    (() => {
      const STORAGE_KEY = "studymate.tasks.v1";
      let tasks = [];
      try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); if (!Array.isArray(tasks)) tasks = []; } catch (_) { tasks = []; }
      let filter = "all";
      let mode = "focus";
      let remaining = 25 * 60;
      let interval = null;
    
      const $ = (id) => document.getElementById(id);
      const taskList = $("taskList");
      const taskInput = $("taskInput");
    
      const now = new Date();
      $("todayDate").textContent = new Intl.DateTimeFormat("ko-KR", {year:"numeric", month:"long", day:"numeric", weekday:"short"}).format(now);
      const quoteInput = $("quoteInput");
      const savedQuote = localStorage.getItem("studymate.dailyQuote") || "";
      quoteInput.value = savedQuote;
      $("saveQuote").addEventListener("click", () => {
        localStorage.setItem("studymate.dailyQuote", quoteInput.value.trim());
        $("saveQuote").textContent = "저장됨";
        setTimeout(() => $("saveQuote").textContent = "저장", 1200);
      });
    
      function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
      function updateStats() {
        const total = tasks.length;
        const done = tasks.filter(t => t.done).length;
        const pct = total ? Math.round(done / total * 100) : 0;
        $("totalCount").textContent = total;
        $("doneCount").textContent = done;
        $("percent").textContent = pct + "%";
        $("emptyState").style.display = tasks.filter(t => filter === "all" || (filter === "active" ? !t.done : t.done)).length ? "none" : "block";
      }
      function renderTasks() {
        taskList.replaceChildren();
        const visible = tasks.filter(t => filter === "all" || (filter === "active" ? !t.done : t.done));
        visible.forEach(task => {
          const li = document.createElement("li");
          li.className = "task" + (task.done ? " done" : "");
          const check = document.createElement("input");
          check.type = "checkbox"; check.className = "task-check"; check.checked = !!task.done;
          check.setAttribute("aria-label", "완료 여부");
          check.addEventListener("change", () => { task.done = check.checked; save(); renderTasks(); });
          const name = document.createElement("span"); name.className = "task-name"; name.textContent = task.name;
          const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = task.done ? "완료" : "할 일";
          const del = document.createElement("button"); del.className = "delete"; del.type = "button"; del.textContent = "×"; del.title = "목표 삭제";
          del.addEventListener("click", () => { tasks = tasks.filter(t => t.id !== task.id); save(); renderTasks(); });
          li.append(check, name, tag, del); taskList.append(li);
        });
        updateStats();
      }
      $("taskForm").addEventListener("submit", e => {
        e.preventDefault();
        const name = taskInput.value.trim();
        if (!name) return;
        tasks.unshift({id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), name, done:false});
        save(); taskInput.value = ""; renderTasks(); taskInput.focus();
      });
      document.querySelectorAll(".filter").forEach(btn => btn.addEventListener("click", () => {
        filter = btn.dataset.filter;
        document.querySelectorAll(".filter").forEach(b => b.classList.toggle("active", b === btn));
        renderTasks();
      }));
      $("clearDone").addEventListener("click", () => { tasks = tasks.filter(t => !t.done); save(); renderTasks(); });
    
      function displayTimer() {
        const m = Math.floor(remaining / 60).toString().padStart(2, "0");
        const s = (remaining % 60).toString().padStart(2, "0");
        $("timerDisplay").textContent = m + ":" + s;
        document.title = m + ":" + s + " · StudyMate";
      }
      function stopTimer() {
        if (interval) clearInterval(interval);
        interval = null;
        $("startPause").textContent = "시작";
      }
      function chooseMode(nextMode) {
        stopTimer(); mode = nextMode; remaining = (mode === "focus" ? 25 : 5) * 60;
        $("timerMode").textContent = mode === "focus" ? "집중 시간" : "휴식 시간";
        document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
        displayTimer();
      }
      $("startPause").addEventListener("click", () => {
        if (interval) { stopTimer(); return; }
        $("startPause").textContent = "일시정지";
        interval = setInterval(() => {
          remaining = Math.max(0, remaining - 1); displayTimer();
          if (remaining === 0) {
            stopTimer();
            $("timerMode").textContent = mode === "focus" ? "집중 시간 완료! 잠깐 쉬어가요." : "휴식 완료! 다시 시작해 볼까요?";
            try { if ("Notification" in window && Notification.permission === "granted") new Notification("StudyMate", {body: mode === "focus" ? "집중 시간이 끝났어요. 휴식해 보세요!" : "휴식이 끝났어요. 다시 집중해 봐요!"}); } catch (_) {}
          }
        }, 1000);
      });
      $("resetTimer").addEventListener("click", () => chooseMode(mode));
      document.querySelectorAll(".mode-btn").forEach(btn => btn.addEventListener("click", () => chooseMode(btn.dataset.mode)));
    
      const weekStart = new Date(now); weekStart.setDate(now.getDate() - ((now.getDay() + 6) % 7));
      const week = $("weekDays");
      ["월","화","수","목","금","토","일"].forEach((label, i) => {
        const d = new Date(weekStart); d.setDate(weekStart.getDate() + i);
        const cell = document.createElement("div"); cell.className = "day" + (d.toDateString() === now.toDateString() ? " today" : "");
        const dayLabel = document.createElement("div"); dayLabel.textContent = label;
        const dot = document.createElement("div"); dot.className = "day-dot"; dot.textContent = d.getDate();
        cell.append(dayLabel, dot); week.append(cell);
      });
      renderTasks(); displayTimer();
    })();
    </script>
    </body>
    </html>
